<mat-card>
    <mat-card-title>Crear Usuario</mat-card-title>
    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">

            <!-- Nombre -->
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="name" placeholder="Escribe tu nombre" />
                <mat-error *ngIf="form.get('name')?.hasError('required')">
                    El nombre es obligatorio
                </mat-error>
                <mat-error *ngIf="form.get('name')?.hasError('minlength')">
                    El nombre debe tener al menos 3 caracteres
                </mat-error>
            </mat-form-field>

            <!-- Usuario -->
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Usuario</mat-label>
                <input matInput formControlName="username" placeholder="Escribe tu usuario" />
                <mat-error *ngIf="form.get('username')?.hasError('required')">
                    El usuario es obligatorio
                </mat-error>
                <mat-error *ngIf="form.get('username')?.hasError('minlength')">
                    El usuario debe tener al menos 3 caracteres
                </mat-error>
            </mat-form-field>

            <!-- Email -->
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" placeholder="ejemplo@email.com" />
                <mat-error *ngIf="form.get('email')?.hasError('required')">
                    El email es obligatorio
                </mat-error>
                <mat-error *ngIf="form.get('email')?.hasError('email')">
                    Debe ser un email válido
                </mat-error>
            </mat-form-field>

            <!-- Teléfono -->
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Teléfono</mat-label>
                <input matInput type="tel" formControlName="phone" placeholder="555-123-4567" />
            </mat-form-field>

            <!-- Sitio Web -->
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Sitio Web</mat-label>
                <input matInput formControlName="website" placeholder="https://ejemplo.com" />
            </mat-form-field>

            <!-- Botón -->
            <div class="mt-3">
                <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting">
                    {{ isSubmitting ? 'Creando...' : 'Crear Usuario' }}
                </button>
            </div>

        </form>
    </mat-card-content>
</mat-card>
